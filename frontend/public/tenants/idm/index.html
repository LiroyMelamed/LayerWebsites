  <!-- Soft-open: WhatsApp/in-app browsers skip Universal Links, so /s/* must try the app scheme.
       Never send signing traffic to the App Store. Native LawyerApp-Idm is not published yet. -->
  <script>
    (function () {
      var path = window.location.pathname || '';
      var search = window.location.search || '';
      if (search.indexOf('web=1') !== -1) {
        try { sessionStorage.setItem('lw_prefer_web', '1'); } catch (e) { }
        return;
      }
      if (search.indexOf('fromApp=true') !== -1) {
        try { sessionStorage.setItem('lw_fromApp', '1'); } catch (e) { }
        return;
      }
      try {
        if (sessionStorage.getItem('lw_fromApp') === '1') return;
        if (sessionStorage.getItem('lw_prefer_web') === '1') return;
      } catch (e) { }

      var ua = navigator.userAgent || '';
      var isIOS = /iPhone|iPad|iPod/i.test(ua);
      var isAndroid = /Android/i.test(ua);
      if (!isIOS && !isAndroid) return;

      var APP_SCHEME = 'idm';
      var APP_SCHEME_ALT = 'melamedia';

      function tryScheme(url) {
        if (!url) return;
        try {
          var iframe = document.createElement('iframe');
          iframe.style.display = 'none';
          iframe.src = url;
          (document.body || document.documentElement).appendChild(iframe);
          setTimeout(function () {
            try { iframe.parentNode && iframe.parentNode.removeChild(iframe); } catch (e) { }
          }, 1500);
        } catch (e) { }
      }

      // Public signing: try app scheme first on mobile, then continue in the browser (1A).
      var isSigningPath = path.indexOf('/PublicSign') === 0 || path.indexOf('/s/') === 0;
      if (isSigningPath) {
        var signingTarget = APP_SCHEME + ':/' + path + search;
        var signingTargetAlt = APP_SCHEME_ALT + ':/' + path + search;
        tryScheme(signingTarget);
        setTimeout(function () {
          if (!document.hidden) tryScheme(signingTargetAlt);
        }, 400);
        return;
      }

      // Other public/client flows stay in the browser — no soft-open to the native app.
      var publicPaths = [
        '/AdminStack',
        '/ViewSignedDocument',
        '/Verify/Evidence',
        '/Pricing',
        '/SecurityScreen',
        '/Privacy',
        '/Continuity',
        '/Compliance',
        '/ChatBot',
        '/ticket',
        '/TicketScreen',
        '/n/',
        '/calendar-invite'
      ];
      for (var i = 0; i < publicPaths.length; i++) {
        if (path.indexOf(publicPaths[i]) === 0) return;
      }

      var IOS_STORE = '';
      var ANDROID_STORE = '';

      var left = false;
      function onHide() {
        if (document.hidden) left = true;
      }
      document.addEventListener('visibilitychange', onHide);

      tryScheme(APP_SCHEME + '://');
      setTimeout(function () {
        if (!left && !document.hidden) tryScheme(APP_SCHEME_ALT + '://');
      }, 400);

      function showBanner() {
        if (left || document.hidden) return;
        if (document.getElementById('lw-app-download-banner')) return;
        var storeUrl = isIOS ? IOS_STORE : ANDROID_STORE;
        if (!storeUrl) return;
        var bar = document.createElement('div');
        bar.id = 'lw-app-download-banner';
        bar.setAttribute('dir', 'rtl');
        bar.style.cssText = [
          'position:fixed', 'z-index:99999', 'left:12px', 'right:12px', 'bottom:12px',
          'display:flex', 'align-items:center', 'gap:10px', 'justify-content:space-between',
          'padding:12px 14px', 'border-radius:14px',
          'background:#111', 'color:#fff', 'font-family:Heebo,Arial,sans-serif',
          'font-size:14px', 'line-height:1.35', 'box-shadow:0 8px 24px rgba(0,0,0,.25)'
        ].join(';');
        var text = document.createElement('div');
        text.style.cssText = 'flex:1;min-width:0';
        text.textContent = 'לחוויה מיטבית ניתן להשתמש באפליקציה';
        var actions = document.createElement('div');
        actions.style.cssText = 'display:flex;align-items:center;gap:8px;flex-shrink:0';
        var openBtn = document.createElement('a');
        openBtn.href = storeUrl;
        openBtn.target = '_blank';
        openBtn.rel = 'noopener noreferrer';
        openBtn.textContent = 'הורדה';
        openBtn.style.cssText = 'color:#111;background:#fff;text-decoration:none;padding:8px 12px;border-radius:999px;font-weight:600';
        var closeBtn = document.createElement('button');
        closeBtn.type = 'button';
        closeBtn.setAttribute('aria-label', 'סגור');
        closeBtn.textContent = 'ביטול';
        closeBtn.style.cssText = 'color:#fff;background:transparent;border:1px solid rgba(255,255,255,.35);padding:8px 12px;border-radius:999px;cursor:pointer;font:inherit';
        closeBtn.onclick = function () {
          try { sessionStorage.setItem('lw_prefer_web', '1'); } catch (e) { }
          if (bar.parentNode) bar.parentNode.removeChild(bar);
        };
        actions.appendChild(openBtn);
        actions.appendChild(closeBtn);
        bar.appendChild(text);
        bar.appendChild(actions);
        (document.body || document.documentElement).appendChild(bar);
      }

      setTimeout(function () {
        document.removeEventListener('visibilitychange', onHide);
        showBanner();
      }, 1600);
    })();
  </script>
