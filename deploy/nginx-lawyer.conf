# Nginx for lawyer.mela-media.co.il — allow embed on mela-media.co.il
# Frontend VPS: /etc/nginx/sites-available/lawyer.mela-media.co.il

server {
    listen 443 ssl http2;
    server_name lawyer.mela-media.co.il;
    root /var/www/lawyer;
    index index.html;

    # Allow iframe embed from marketing site only
    add_header Content-Security-Policy "frame-ancestors 'self' https://mela-media.co.il https://www.mela-media.co.il" always;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# Backend: api-lawyer.mela-media.co.il → PM2 lawyer-api :3005
